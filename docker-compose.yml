name: db-genius

services:
  app:
    build: .
    ports:
      - "${SERVER_PORT:-8109}:8109"
    environment:
      # PostgreSQL 为远程独立部署，通过 .env 指定完整 JDBC 地址
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # RabbitMQ 与 app 同在 compose 网络，用服务名互连（不是 localhost）
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-guest}
      DB_GENIUS_DEFAULT_MODEL_API_KEY: ${DB_GENIUS_DEFAULT_MODEL_API_KEY}
      DB_GENIUS_DEFAULT_MODEL_BASE_URL: ${DB_GENIUS_DEFAULT_MODEL_BASE_URL:-https://api.deepseek.com}
      DB_GENIUS_DEFAULT_MODEL: ${DB_GENIUS_DEFAULT_MODEL:-deepseek-v4-pro}
      DB_GENIUS_ENCRYPT_KEY: ${DB_GENIUS_ENCRYPT_KEY}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      ALIYUN_OSS_DIR_PREFIX: ${ALIYUN_OSS_DIR_PREFIX:-uploads/}
      ALIYUN_OCR_ENABLED: ${ALIYUN_OCR_ENABLED:-false}
      ALIYUN_OCR_ENDPOINT: ${ALIYUN_OCR_ENDPOINT:-ocr-api.cn-hangzhou.aliyuncs.com}
      DB_GENIUS_TRIAL_ENABLED: ${DB_GENIUS_TRIAL_ENABLED:-false}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== 多数据库适配器验证实例（可选，默认不启动）=====
  # 启动方式：docker compose --profile verify up -d
  # 用于手动验证各 DatabaseAdapter 的连通性/元数据抽取，验证库账号仅供本机测试。

  sqlserver-verify:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["verify"]
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "DbGenius!234" # 仅供本机验证，请勿复用到任何真实环境
    ports:
      - "1433:1433"

  oracle-xe-verify:
    image: gvenzl/oracle-xe:21-slim
    profiles: ["verify"]
    environment:
      ORACLE_PASSWORD: "DbGenius!234" # 仅供本机验证，请勿复用到任何真实环境
      # 默认自带 service：XEPDB1（连接时 dbName 填 XEPDB1）
    ports:
      - "1521:1521"

  # TiDB 验证实例（较重，按需取消注释；playground 方式更推荐：tiup playground）
  # tidb-verify:
  #   image: pingcap/tidb:latest
  #   profiles: ["verify"]
  #   command: ["--store=unistore", "--path=/tmp/tidb"]
  #   ports:
  #     - "4000:4000"

  # Doris 验证实例（FE+BE all-in-one，较重，按需取消注释）
  # doris-verify:
  #   image: apache/doris:doris-all-in-one-2.1.0
  #   profiles: ["verify"]
  #   ports:
  #     - "9030:9030"  # FE MySQL 协议端口（适配器连接用）
  #     - "8030:8030"  # FE HTTP 端口

volumes:
  rabbitmqdata:
