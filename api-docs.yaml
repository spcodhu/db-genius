openapi: 3.0.3
info:
  title: DB-Genius API
  description: AI 数据库大师 - 智能 SQL 生成、执行与数据库对比
  version: 1.0.0

servers:
  - url: http://localhost:8109/api
    description: 本地开发环境

security:
  - ApiKeyAuth: []

tags:
  - name: 认证管理
    description: 登录、登出、用户创建
  - name: 数据库配置
    description: 数据库连接配置 CRUD、连通性测试、文档生成
  - name: AI 对话
    description: 统一自然语言对话入口，自动识别意图并路由到 SQL 查询、工作流或数据库对比（SSE 流式）
  - name: 模型配置
    description: 多 Provider 模型配置管理，用户可自定义 API Key、Base URL 与模型名，支持系统内置厂商预设
  - name: 文件上传
    description: Excel 文件上传
  - name: 对话管理
    description: 对话列表、消息、删除
  - name: 联系销售
    description: 试用版用户提交商务咨询
  - name: 试用版状态
    description: 查询当前是否为试用版部署

# ========================================================================
# Paths
# ========================================================================
paths:

  # ---- 认证 ----
  /auth/login:
    post:
      tags: [认证管理]
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_LoginVO'

  /auth/logout:
    post:
      tags: [认证管理]
      summary: 用户登出
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/user:
    post:
      tags: [认证管理]
      summary: 创建用户（仅管理员）
      description: |
        **试用版限制：** 试用版（`db-genius.trial.enabled=true`）下该接口直接返回 `403`，禁止创建新用户。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- 试用版状态 ----
  /trial/status:
    get:
      tags: [试用版状态]
      summary: 查询当前是否为试用版
      description: 前端可通过该接口判断当前环境是否为试用版，从而隐藏或禁用部分功能入口。
      security: []
      responses:
        '200':
          description: 试用版状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_TrialStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- 数据库配置 ----
  /db-config:
    get:
      tags: [数据库配置]
      summary: 获取当前用户的全部数据库配置
      description: |
        **试用版说明：** 试用版仅返回内置的 `db-genius` 测试库配置，且 `host`、`port`、`dbName`、`username`、`docContent` 等敏感字段会被替换为 `*`。
      responses:
        '200':
          description: 配置列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_DbConfigVO_List'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [数据库配置]
      summary: 新建数据库配置
      description: |
        创建配置后，系统会**异步自动**执行：
        1. 连通性测试 → status 更新为 1（成功）或 2（失败）
        2. 连通成功时自动生成数据库结构文档（Markdown）

        创建后立即返回 status=0（正在验证），前端应轮询 GET /db-config/{id} 获取最新状态。

        **试用版限制：** 试用版下禁止新增任何数据库配置，直接返回 `403`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DbConfigRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_DbConfigVO'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /db-config/{id}:
    get:
      tags: [数据库配置]
      summary: 获取单个数据库配置详情
      description: |
        **试用版说明：** 若该配置为内置测试库，敏感字段会被替换为 `*`。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/DbConfigVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [数据库配置]
      summary: 更新数据库配置
      description: |
        更新配置后，系统会**异步自动**重新验证连通性并重新生成文档。
        status 重置为 0，docContent 清空，直到异步验证完成。

        **试用版限制：** 试用版下禁止更新内置测试库配置，直接返回 `403`。
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DbConfigRequest'
      responses:
        '200':
          $ref: '#/components/responses/DbConfigVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [数据库配置]
      summary: 删除数据库配置
      description: |
        **试用版限制：** 试用版下禁止删除内置测试库配置，直接返回 `403`。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /db-config/{id}/test:
    post:
      tags: [数据库配置]
      summary: 测试数据库连通性
      description: |
        **试用版限制：** 试用版下禁止对内置测试库执行连通性测试，直接返回 `403`。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 连通性结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_Boolean'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /db-config/{id}/generate-doc:
    post:
      tags: [数据库配置]
      summary: 自动生成数据库说明文档
      description: |
        读取数据库元数据（表、字段、索引、数据量），生成 Markdown 格式文档供 AI 使用。

        **试用版限制：** 试用版下禁止为内置测试库重新生成文档，直接返回 `403`。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 文档内容（Markdown）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_String'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /db-config/{id}/refresh-doc:
    post:
      tags: [数据库配置]
      summary: 手动刷新数据库文档（异步）
      description: |
        数据库结构变更后调用，重新验证连接并重新生成数据库文档（Markdown）。

        本接口为**异步受理**：立即返回提示文案，配置 status 转为 0（正在验证），
        后台通过消息队列执行「重新验证连接 + 重新生成文档」，
        前端可轮询 `GET /db-config/{id}` 查看 status 与 docGeneratedAt 获取最新结果。

        与 `POST /db-config/{id}/generate-doc`（同步生成并返回文档内容）不同，
        本接口不返回文档内容，只受理任务。

        错误码：
        - `404`：配置不存在或不属于当前用户
        - `403`：试用版下禁止对内置测试库执行刷新

        **试用版限制：** 试用版下禁止刷新内置测试库文档，直接返回 `403`。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 刷新任务已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_String'
              example:
                code: 200
                message: success
                data: 文档刷新任务已受理，正在后台重新验证连接并生成文档
        '401':
          $ref: '#/components/responses/Unauthorized'

  /db-config/{id}/doc:
    get:
      tags: [数据库配置]
      summary: 查看已生成的数据库文档
      description: |
        **试用版说明：** 若该配置为内置测试库，文档内容会返回 `*`（脱敏），避免暴露真实表结构。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/String'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- AI 对话（统一 SSE 流式入口） ----
  /chat:
    post:
      tags: [AI 对话]
      summary: 统一对话入口（SSE 流式输出）
      description: |
        用户输入自然语言描述，系统先进行意图识别，再自动路由到对应的智能体执行。

        **SSE 事件流类型：**

        | type | 含义 | content 格式 |
        |------|------|-------------|
        | `classifying` | 正在识别意图 | 字符串，如 "正在分析您的问题..." |
        | `classified` | 意图识别完成 | JSON 对象：`{"intent": "sql_query", "confidence": 0.95, "reasoning": "...", "needsClarification": false}` |
        | `clarify` | 需要用户确认意图 | JSON 对象：`{"question": "...", "options": [...], "reasoning": "..."}` |
        | `routing` | 正在路由到对应处理器 | 字符串，如 "正在启动 SQL 查询智能体..." |
        | `thinking` | AI 正在分析需求 | 字符串 |
        | `reasoning` | 大模型 thinking 模式的推理内容 | 字符串；`simple_chat` 与 Agent 流程均为流式增量片段 |
        | `step` | 每个 Agent 步骤的结果 | 字符串，SQL 执行结果等 |
        | `content` | 简单会话的流式文本片段 | 字符串 |
        | `summary_delta` | 最终总结的流式 Markdown 增量片段（打字机渲染），其前可能伴随 `reasoning` 增量 | 字符串 |
        | `summary` | 终态全量 Markdown 总结，作为权威内容覆盖流式增量完成最终渲染 | Markdown 字符串 |
        | `context_compact` | 单轮内上下文压缩的过程通知（可按工具卡片渲染，避免压缩期间的莫名等待） | JSON 对象（ContextCompactVO）：`{"phase": "start\|end", "tier": "elide\|summarize", "message": "正在压缩上下文...", "beforeTokens": 51200, "afterTokens": 17100, "affectedUnits": 5}` |
        | `aborted` | 用户主动终止本轮会话（半截输出已落库为 `message.type = aborted`，可从历史记录回放） | null |
        | `error` | 执行出错 | 字符串，错误信息 |
        | `usage` | 本轮 token 用量统计（done 之前发出） | JSON 对象（TokenUsageVO）：`{"promptTokens": 1200, "completionTokens": 340, "totalTokens": 1540, "contextTokens": 1180, "callCount": 4, "conversationTotalTokens": 6120, "contextWindow": 65536}` |
        | `done` | 流结束信号 | null |

        **意图类型：**
        - `simple_chat`：简单会话问答，不需要数据库
        - `sql_query`：SQL 对话查询，需要提供 `dbConfigIds`
        - `workflow`：复杂工作流，需要提供 `dbConfigIds`，可附加 `fileIds`
        - `db_compare`：数据库对比，需要提供 `preDbConfigId` 和 `testDbConfigId`；
          支持全部已接入数据库类型（mysql/postgresql/mongodb/mariadb/tidb/doris/starrocks/oceanbase/oracle/sqlserver）任意两两对比，含跨类型对比（如 MySQL vs PostgreSQL），基于中性元数据模型 diff

        **试用版限制：**
        - `sql_query` 仅支持只读查询（`SELECT/SHOW/DESC/EXPLAIN`），`INSERT/UPDATE/DELETE/DDL` 会被拒绝。
        - `workflow` 和 `db_compare` 意图在试用版下直接返回 `403` 错误。
        - 仅可使用内置的 `db-genius` 测试库。

        **低置信度反问：**
        当系统无法确定意图或缺少前置条件时，会返回 `clarify` 事件并结束连接。前端应展示选项，由用户选择后再发起一次请求，并将选中的意图通过 `confirmedIntent` 字段回传。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedChatRequest'
      responses:
        '200':
          description: SSE 事件流
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseEvent'
              examples:
                classifying:
                  summary: 正在识别意图
                  value:
                    taskId: "uuid"
                    step: 0
                    type: "classifying"
                    content: "正在分析您的问题..."
                    timestamp: 1719648000000
                classified:
                  summary: 意图识别完成
                  value:
                    taskId: "uuid"
                    step: 0
                    type: "classified"
                    content:
                      intent: "sql_query"
                      confidence: 0.95
                      reasoning: "用户要求查询数据库表数据量"
                      needsClarification: false
                    timestamp: 1719648001000
                clarify:
                  summary: 需要用户确认意图
                  value:
                    taskId: "uuid"
                    step: 0
                    type: "clarify"
                    content:
                      question: "我不太确定您的意图，请选择："
                      options:
                        - intent: "sql_query"
                          label: "查询数据库表结构"
                        - intent: "simple_chat"
                          label: "只是想了解相关概念"
                      reasoning: "消息缺少明确的数据库操作描述"
                    timestamp: 1719648001000
                routing:
                  summary: 正在路由
                  value:
                    taskId: "uuid"
                    step: 0
                    type: "routing"
                    content: "正在启动 SQL 查询智能体..."
                    timestamp: 1719648002000
                thinking:
                  summary: AI 分析阶段
                  value:
                    taskId: "uuid"
                    step: 0
                    type: "thinking"
                    content: "正在分析您的查询需求..."
                    timestamp: 1719648003000
                reasoning:
                  summary: 大模型推理内容（thinking 模式）
                  value:
                    taskId: "uuid"
                    step: 1
                    type: "reasoning"
                    content: "用户想查询用户表的数据量，需要先确认表结构，再生成 COUNT 查询..."
                    timestamp: 1719648003500
                step_sql:
                  summary: SQL 生成与执行
                  value:
                    taskId: "uuid"
                    step: 1
                    type: "step"
                    content: "Tool executeSql result: {...}"
                    timestamp: 1719648004000
                summary_delta:
                  summary: 总结流式增量（打字机效果）
                  value:
                    taskId: "uuid"
                    step: 2
                    type: "summary_delta"
                    content: "## 查询结果\n\n"
                    timestamp: 1719648004500
                summary:
                  summary: 任务完成（Markdown 表格）
                  value:
                    taskId: "uuid"
                    step: 2
                    type: "summary"
                    content: |
                      ## 查询结果

                      共查询到 3 条记录：

                      | id | name | age |
                      |---|---|---|
                      | 1 | Alice | 20 |
                      | 2 | Bob | 25 |
                      | 3 | Carol | 22 |
                    timestamp: 1719648005000
                usage:
                  summary: 本轮 token 用量
                  value:
                    taskId: "uuid"
                    step: -1
                    type: "usage"
                    content:
                      promptTokens: 1200
                      completionTokens: 340
                      totalTokens: 1540
                      contextTokens: 1180
                      callCount: 4
                      conversationTotalTokens: 6120
                      contextWindow: 65536
                    timestamp: 1719648005500
                done:
                  summary: 流结束
                  value:
                    taskId: "uuid"
                    step: -1
                    type: "done"
                    content: null
                    timestamp: 1719648006000
                error:
                  summary: 错误
                  value:
                    taskId: "uuid"
                    step: -1
                    type: "error"
                    content: "SQL 语法错误：xxx"
                    timestamp: 1719648006000
        '400':
          description: 请求参数校验失败或缺少前置条件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_Void'
              example:
                code: 400
                message: "Message is required"
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- 对话管理 ----
  /chat/conversations:
    get:
      tags: [对话管理]
      summary: 获取当前用户的对话列表
      responses:
        '200':
          description: 对话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_ConversationVO_List'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chat/conversations/{id}/messages:
    get:
      tags: [对话管理]
      summary: 获取某对话的全部消息
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 消息列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_Message_List'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chat/conversations/{id}:
    delete:
      tags: [对话管理]
      summary: 删除对话
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chat/conversations/{id}/compress:
    post:
      tags: [对话管理]
      summary: 压缩对话上下文
      description: |
        主动压缩指定对话的上下文（将历史消息摘要化以降低 token 占用）。

        采用 LLM 摘要策略（`SummaryContextCompressor`）：保留最近若干条消息原样，
        更早的消息折叠为一条 summary 消息。也可在占用达阈值时自动触发
        （`db-genius.context.auto-compress.enabled/threshold`，默认关闭）。

        本接口只处理**跨轮历史**。单轮内（Agent 多步 ReAct 循环）的上下文瘦身是自动的、
        分档进行的：先做零成本的确定性观测遮蔽，仍不够才升级为 LLM 摘要，
        过程通过 SSE `context_compact` 事件对前端可见。

        错误码：
        - `404`：对话不存在或不属于当前用户
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressRequest'
      responses:
        '200':
          description: 压缩结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_CompressResultVO'
              example:
                code: 200
                message: success
                data:
                  conversationId: 1
                  compressed: false
                  beforeTokens: 6120
                  afterTokens: 6120
                  summaryMessageId: null
                  message: "上下文压缩功能即将上线，敬请期待"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 对话不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_Void'

  # ---- 文件上传 ----
  /file/upload:
    post:
      tags: [文件上传]
      summary: 上传文件（Excel）
      description: |
        **试用版限制：** 试用版下禁止文件上传，直接返回 `403`。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel 文件（.xlsx / .xls），最大 50MB
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_UploadedFile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- 模型配置 ----
  /model-config/providers:
    get:
      tags: [模型配置]
      summary: 获取模型厂商预设列表
      description: |
        返回系统内置的模型厂商预设（DeepSeek、OpenAI、Ollama、自定义 OpenAI 兼容）。
        用户创建模型配置时可选择预设，复用其 `defaultBaseUrl` / `defaultModel`，
        也可选择 `custom` 预设自行填写全部参数。

        当前所有预设均为 `openai_compatible`（OpenAI 兼容协议）类型。
      responses:
        '200':
          description: 预设列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_ModelProviderVO_List'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /model-config/configs:
    get:
      tags: [模型配置]
      summary: 获取当前用户的模型配置列表
      description: |
        返回当前用户保存的全部模型配置，按「默认优先、创建时间倒序」排列。
        响应不包含 API Key（密文也不返回），密钥仅用于后端调用，前端无法读取。
      responses:
        '200':
          description: 配置列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_UserModelConfigVO_List'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [模型配置]
      summary: 新建模型配置
      description: |
        创建一套用户的 AI 模型配置，API Key 由后端 AES-256-GCM 加密后落库。

        - `baseUrl` 可省略：省略时复用所选 provider 预设的 `defaultBaseUrl`（`custom` 预设必填）。
        - 用户的第一条配置自动设为默认。
        - `providerType` 当前固定为 `openai_compatible`。

        **试用版限制：** 试用版下禁止新增模型配置，直接返回 `403`（试用版统一使用系统默认模型）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserModelConfigRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_UserModelConfigVO'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /model-config/configs/{id}:
    put:
      tags: [模型配置]
      summary: 编辑模型配置
      description: |
        更新模型配置。`apiKey` 传空字符串或省略时保持原密钥不变（编辑其他字段无需重新输入密钥）。

        **试用版限制：** 试用版下禁止编辑模型配置，直接返回 `403`。
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserModelConfigRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_UserModelConfigVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [模型配置]
      summary: 删除模型配置
      description: |
        删除模型配置。

        错误码：
        - `400`：该配置是当前默认配置，需先将其他配置设为默认
        - `404`：配置不存在或不属于当前用户

        **试用版限制：** 试用版下禁止删除模型配置，直接返回 `403`。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /model-config/configs/{id}/default:
    put:
      tags: [模型配置]
      summary: 设为默认模型配置
      description: |
        将指定配置设为当前用户的默认配置（同一用户仅一条默认，设置后自动取消旧默认）。

        错误码：
        - `400`：该配置已禁用，不能设为默认
        - `404`：配置不存在或不属于当前用户

        **试用版限制：** 试用版下禁止切换默认模型配置，直接返回 `403`。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /model-config/active:
    get:
      tags: [模型配置]
      summary: 获取当前生效的模型配置
      description: |
        返回当前驱动对话的模型配置概要（不含密钥）：
        - 优先取用户设为默认且启用的配置；
        - 无默认时取最新启用的一条；
        - 用户完全未配置时返回系统兜底配置（`providerCode=system`，`id=null`），
          实际使用部署时的 `DB_GENIUS_DEFAULT_MODEL_*` 环境变量；
        - 系统兜底也缺失时接口返回 `500`，前端应引导用户去配置模型。
      responses:
        '200':
          description: 当前生效配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_UserModelConfigVO'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /model-config/context-window/lookup:
    post:
      tags: [模型配置]
      summary: 远程识别模型的最大上下文窗口
      description: |
        根据 `baseUrl + apiKey + modelName` 识别模型的最大上下文窗口（tokens）。

        解析顺序：
        1. 命中内置已知模型注册表（deepseek / gpt-4o / qwen / glm / kimi 等常见模型）→ `source="registry"`，返回已知窗口；
        2. 未命中则请求 `{baseUrl}/v1/models`（Bearer 鉴权，5s 超时）探测模型是否存在，仅验证存在性 → `source="not_found"`，`contextWindow=null`；
        3. 探测失败不报错，同样返回 `not_found`，由用户手填。

        API Key 走请求体传输，不落日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextWindowLookupRequest'
      responses:
        '200':
          description: 识别结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_ContextWindowLookupVO'
              example:
                code: 200
                message: success
                data:
                  modelName: deepseek-chat
                  contextWindow: 65536
                  source: registry
        '401':
          $ref: '#/components/responses/Unauthorized'

  /model-config/configs/{id}/context-window:
    get:
      tags: [模型配置]
      summary: 远程识别已保存配置的上下文窗口
      description: |
        与 POST /model-config/context-window/lookup 相同逻辑，但针对已保存的模型配置：
        后端解密该配置的 API Key 后探测，前端无需回传密钥。

        错误码：
        - `404`：配置不存在或不属于当前用户

        **试用版限制：** 试用版下返回 `403`。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 识别结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_ContextWindowLookupVO'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---- 联系销售 ----
  /sales/contact:
    post:
      tags: [联系销售]
      summary: 提交商务咨询
      description: |
        试用版用户可提交公司名称、联系方式（邮箱/手机号）及备注信息，后端持久化到 `sales_contact` 表。
        该接口**无需登录**即可访问。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesContactRequest'
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_SalesContact'
        '400':
          description: 参数校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/R_Void'

# ========================================================================
# Components
# ========================================================================
components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Sa-Token 认证，登录后从 /auth/login 获取 token 值。
        后续请求需在 Header 中携带 `Authorization: <token>`。
        若 token 过期、未携带或后端重启导致 token 失效，接口将返回 `code=401`，
        message 为 `登录已过期，请重新登录`，前端应据此跳转登录弹窗。

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    Ok:
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/R_Void'
    Unauthorized:
      description: 未登录或登录已过期（token 失效、未携带 Authorization 等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/R_Void'
          example:
            code: 401
            message: "登录已过期，请重新登录"
            data: null
    DbConfigVO:
      description: 数据库配置
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/R_DbConfigVO'
    String:
      description: 字符串结果
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/R_String'

  schemas:

    # ---- 通用响应 ----
    R_Void:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          nullable: true

    R_Boolean:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          type: boolean

    R_String:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          type: string

    R_LoginVO:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
        data:
          $ref: '#/components/schemas/LoginVO'

    R_DbConfigVO:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
        data:
          $ref: '#/components/schemas/DbConfigVO'

    R_DbConfigVO_List:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/DbConfigVO'

    R_ConversationVO_List:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/ConversationVO'

    R_Message_List:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    R_UploadedFile:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
        data:
          $ref: '#/components/schemas/UploadedFile'

    R_TrialStatus:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/TrialStatus'

    R_ModelProviderVO_List:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelProviderVO'

    R_UserModelConfigVO:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserModelConfigVO'

    R_UserModelConfigVO_List:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserModelConfigVO'

    R_SalesContact:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/SalesContact'

    # ---- 请求体 ----
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: admin123

    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        nickname:
          type: string
        role:
          type: string
          enum: [admin, user]
          default: user

    SalesContactRequest:
      type: object
      required: [companyName, contact]
      properties:
        companyName:
          type: string
          description: 公司名称
          example: 某某科技有限公司
          maxLength: 256
        contact:
          type: string
          description: 联系方式，邮箱或手机号
          example: contact@example.com
          maxLength: 256
        remark:
          type: string
          description: 备注信息
          example: 希望了解企业版报价与私有化部署方案
          maxLength: 4000

    DbConfigRequest:
      type: object
      required: [name, dbName]
      properties:
        name:
          type: string
          description: 配置名称（用户自定义）
          example: 生产环境-主库
        dbType:
          type: string
          default: mysql
          enum: [mysql, postgresql, mongodb, mariadb, tidb, doris, starrocks, oceanbase, oracle, sqlserver]
          description: |
            目标数据库类型，缺省为 `mysql`。各类型必填项不同（DTO 层不做固定校验，
            由服务端按类型校验，不满足返回 `400`）：
            - `mysql` / `postgresql` / `mariadb` / `tidb` / `doris` / `starrocks` / `oceanbase` / `oracle` / `sqlserver`：必填 host、port、dbName、username、password
            - `mongodb`：必填 host、port、dbName；username、password 可空（支持无认证部署）
            - `mariadb` / `tidb` / `doris` / `starrocks` / `oceanbase` 为 MySQL 协议兼容，连接参数与 mysql 一致
        host:
          type: string
          description: 数据库主机
          example: 192.168.1.100
        port:
          type: integer
          description: 数据库端口
          example: 3306
        dbName:
          type: string
          description: 数据库名
          example: my_database
        username:
          type: string
          description: 登录用户名（除 mongodb 外均必填）
          example: root
        password:
          type: string
          description: 登录密码（除 mongodb 外均必填；mongodb 可空）
          example: my_password

    UserModelConfigRequest:
      type: object
      required: [providerCode, providerType, displayName, apiKey, modelName]
      properties:
        providerCode:
          type: string
          description: |
            厂商预设标识：`deepseek` / `openai` / `ollama` / `custom`（自定义 OpenAI 兼容）。
            取自 GET /model-config/providers 返回的 providerCode。
          example: deepseek
        providerType:
          type: string
          enum: [openai_compatible]
          description: 协议类型，当前固定为 `openai_compatible`
          example: openai_compatible
        displayName:
          type: string
          description: 用户给这套配置起的名字
          example: 我的 DeepSeek
          maxLength: 128
        baseUrl:
          type: string
          nullable: true
          description: |
            API 地址。省略或为空时复用所选预设的 defaultBaseUrl；
            `custom` 预设必填。
          example: https://api.deepseek.com
          maxLength: 256
        apiKey:
          type: string
          description: |
            明文 API Key，后端 AES-256-GCM 加密后落库，任何接口都不会回传。
            编辑配置时传空字符串或省略可保持原密钥不变。
          example: sk-xxxx
        modelName:
          type: string
          description: 模型名，如 deepseek-v4-pro、gpt-4o
          example: deepseek-v4-pro
          maxLength: 128
        contextWindow:
          type: integer
          nullable: true
          minimum: 1
          description: |
            模型最大上下文窗口（tokens）。留空时后端按内置已知模型注册表自动识别，
            未识别到则保持为空，前端上下文占用条只显示绝对值。
          example: 65536

    UnifiedChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 用户自然语言消息
          example: 帮我查询年龄大于 18 的女生用户
        conversationId:
          type: integer
          format: int64
          nullable: true
          description: 对话 ID，null 则新建对话
        dbConfigIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
          description: 数据库配置 ID 列表（sql_query / workflow 使用）
          example: [1]
        preDbConfigId:
          type: integer
          format: int64
          nullable: true
          description: 生产镜像数据库配置 ID（db_compare 使用）
        testDbConfigId:
          type: integer
          format: int64
          nullable: true
          description: 测试环境数据库配置 ID（db_compare 使用）
        fileIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
          description: 已上传的文件 ID 列表（workflow 使用）
        confirmedIntent:
          type: string
          nullable: true
          enum: [simple_chat, sql_query, workflow, db_compare]
          description: 用户确认后的意图，传入时跳过 LLM 分类直接路由

    # ---- 响应体 ----
    LoginVO:
      type: object
      properties:
        token:
          type: string
          description: Sa-Token 值，后续请求放入 Authorization header
          example: "8f7e6d5c-4b3a-2918-7654-3210fedcba98"
        username:
          type: string
          example: admin
        nickname:
          type: string
          example: Administrator
        role:
          type: string
          example: admin

    DbConfigVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 生产环境-主库
        dbType:
          type: string
          description: 数据库类型（mysql / postgresql / mongodb / mariadb / tidb / doris / starrocks / oceanbase / oracle / sqlserver）
          example: mysql
        host:
          type: string
          example: 192.168.1.100
        port:
          type: integer
          example: 3306
        dbName:
          type: string
          example: my_database
        username:
          type: string
          example: root
        status:
          type: integer
          description: "状态码，对应枚举 DbConfigStatus"
          enum: [0, 1, 2]
        statusDesc:
          type: string
          description: "状态描述（枚举自带）"
          example: 连接正常
          enum: ["正在验证...", "连接正常", "连接异常"]
        docContent:
          type: string
          nullable: true
          description: 自动生成的 Markdown 格式数据库文档
        docGeneratedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ConversationVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        type:
          type: string
          enum: [simple_chat, sql_query, workflow, db_compare]
        dbConfigIds:
          type: string
          description: 关联的数据库配置 ID（逗号分隔）
        totalTokens:
          type: integer
          format: int64
          description: 对话累计消耗的 token 总数
          example: 6120
        contextTokens:
          type: integer
          nullable: true
          description: 当前上下文占用（最近一次 LLM 调用的 prompt tokens）
          example: 1180
        createdAt:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: integer
          format: int64
        conversationId:
          type: integer
          format: int64
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        step:
          type: integer
          nullable: true
          description: Agent 步骤序号
        type:
          type: string
          nullable: true
          description: |
            消息类型。进入后续 LLM 上下文的只有 user / summary（及历史遗留的 null），
            其余为过程消息或已排除类型：
            - step / tool：Agent 每步的思考与工具执行结果，仅供前端回放
            - aborted：用户主动终止时落库的半截回答，前端可渲染「已终止」标记，不进入后续上下文
            - compressed：已被上下文压缩取代的历史消息
          enum: [thinking, sql, result, error, file_parsed, step, tool, summary, aborted,
                 compressed, done, user, classifying, classified, clarify, routing, content]
        fileUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    UploadedFile:
      type: object
      description: 上传文件信息（UploadedFileVO），不含 OSS 存储 key
      properties:
        id:
          type: integer
          format: int64
        originalName:
          type: string
          example: 用户数据.xlsx
        fileSize:
          type: integer
          format: int64
        contentType:
          type: string
          example: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        createdAt:
          type: string
          format: date-time

    TrialStatus:
      type: object
      properties:
        trialEnabled:
          type: boolean
          description: 当前是否为试用版部署
          example: true

    ModelProviderVO:
      type: object
      description: 模型厂商预设
      properties:
        providerCode:
          type: string
          description: 预设标识，创建配置时回传给 providerCode
          example: deepseek
        displayName:
          type: string
          description: 展示名
          example: DeepSeek
        providerType:
          type: string
          enum: [openai_compatible]
          example: openai_compatible
        defaultBaseUrl:
          type: string
          nullable: true
          description: 预设 API 地址（custom 预设为 null）
          example: https://api.deepseek.com
        defaultModel:
          type: string
          nullable: true
          description: 预设推荐模型（custom 预设为 null）
          example: deepseek-v4-pro
        builtin:
          type: boolean
          description: 是否内置预设（内置不可删除）
          example: true
        sortOrder:
          type: integer
          description: 排序权重，越小越靠前
          example: 10

    UserModelConfigVO:
      type: object
      description: 用户模型配置（不含任何形式的 API Key）
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: 配置 ID；系统兜底配置（providerCode=system）时为 null
        providerCode:
          type: string
          description: 厂商预设标识；`system` 表示系统兜底配置
          example: deepseek
        providerType:
          type: string
          enum: [openai_compatible]
          example: openai_compatible
        displayName:
          type: string
          description: 配置名称
          example: 我的 DeepSeek
        baseUrl:
          type: string
          example: https://api.deepseek.com
        modelName:
          type: string
          example: deepseek-v4-pro
        contextWindow:
          type: integer
          nullable: true
          description: 模型最大上下文窗口（tokens），未识别到时为 null
          example: 65536
        isDefault:
          type: boolean
          description: 是否为默认配置
          example: true
        status:
          type: integer
          enum: [0, 1]
          description: "1=已启用，0=已禁用"
          example: 1
        statusDesc:
          type: string
          example: 已启用
        createdAt:
          type: string
          format: date-time

    SalesContact:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 留言记录 ID
        companyName:
          type: string
          description: 公司名称
          example: 某某科技有限公司
        contact:
          type: string
          description: 联系方式
          example: contact@example.com
        remark:
          type: string
          description: 备注信息
          example: 希望了解企业版报价与私有化部署方案
        createdAt:
          type: string
          format: date-time

    SseEvent:
      type: object
      description: SSE 流式事件，每条 data 为一个 JSON 对象
      properties:
        taskId:
          type: string
          description: 本次任务唯一 ID，可用于日志追踪
        step:
          type: integer
          description: "Agent 步骤序号，-1 表示终态事件（done/error）"
        type:
          type: string
          description: 事件类型
          enum: [thinking, reasoning, step, summary_delta, summary, aborted, error, done,
                 classifying, classified, clarify, routing, content, usage, context_compact]
        content:
          description: |
            事件内容，根据 type 不同有不同含义：
            - classifying: "正在分析您的问题..."
            - classified: {"intent": "sql_query", "confidence": 0.95, ...}
            - clarify: {"question": "...", "options": [...], "reasoning": "..."}
            - routing: "正在启动 SQL 查询智能体..."
            - thinking: AI 分析过程的文字描述
            - reasoning: 大模型 thinking 模式的推理内容（simple_chat 为流式增量，Agent 流程为每 step 一条完整块）
            - step: 工具执行结果（SQL 结果 JSON、文件解析结果 JSON 等）
            - content: 简单会话的流式文本片段
            - summary_delta: 最终总结的流式 Markdown 增量片段（打字机渲染）
            - summary: 终态全量 Markdown 总结，权威内容，覆盖流式增量完成最终渲染；查询结果以表格展示，其他任务按结构化 Markdown 展示
            - aborted: null（用户主动终止；半截输出已落库为 message.type = aborted）
            - error: 错误详情
            - usage: {"promptTokens": 1200, "completionTokens": 340, "totalTokens": 1540, "contextTokens": 1180, "callCount": 4, "conversationTotalTokens": 6120, "contextWindow": 65536}（done 之前发出）
            - context_compact: {"phase": "end", "tier": "elide", "message": "上下文已压缩...", "beforeTokens": 51200, "afterTokens": 17100, "affectedUnits": 5}
            - done: null
        timestamp:
          type: integer
          format: int64
          description: 毫秒级时间戳

    # ---- Token 用量与上下文窗口 ----
    TokenUsageVO:
      type: object
      description: 单轮会话的 token 用量统计（SSE usage 事件的 content）
      properties:
        promptTokens:
          type: integer
          format: int64
          description: 本轮累计提示 token
          example: 1200
        completionTokens:
          type: integer
          format: int64
          description: 本轮累计输出 token
          example: 340
        totalTokens:
          type: integer
          format: int64
          description: 本轮合计消耗 token
          example: 1540
        contextTokens:
          type: integer
          description: 当前上下文占用（本轮最后一次 LLM 调用的 prompt tokens）
          example: 1180
        callCount:
          type: integer
          description: 本轮模型调用次数（含意图分类）
          example: 4
        conversationTotalTokens:
          type: integer
          format: int64
          nullable: true
          description: 对话累计消耗 token（含本轮，已持久化）
          example: 6120
        contextWindow:
          type: integer
          nullable: true
          description: 模型最大上下文窗口（tokens），未配置时为 null
          example: 65536

    ContextWindowLookupRequest:
      type: object
      required: [baseUrl, apiKey, modelName]
      properties:
        baseUrl:
          type: string
          description: API 地址（是否已含 /v1 均可）
          example: https://api.deepseek.com
        apiKey:
          type: string
          description: 明文 API Key，仅用于本次探测，不落库不打日志
          example: sk-xxxx
        modelName:
          type: string
          description: 模型名
          example: deepseek-chat

    ContextWindowLookupVO:
      type: object
      properties:
        modelName:
          type: string
          example: deepseek-chat
        contextWindow:
          type: integer
          nullable: true
          description: 识别到的最大上下文窗口；source 为 not_found 时为 null
          example: 65536
        source:
          type: string
          enum: [registry, not_found]
          description: |
            识别来源：
            - `registry`：命中内置已知模型注册表
            - `not_found`：注册表未命中，远程探测仅验证了模型存在性（或探测失败），需手填
          example: registry

    CompressRequest:
      type: object
      properties:
        targetTokens:
          type: integer
          nullable: true
          description: 目标上下文 token 数（可选，未来压缩策略使用）

    CompressResultVO:
      type: object
      properties:
        conversationId:
          type: integer
          format: int64
          example: 1
        compressed:
          type: boolean
          description: 是否实际执行了压缩（当前 noop 策略恒为 false）
          example: false
        beforeTokens:
          type: integer
          nullable: true
          description: 压缩前上下文占用
          example: 6120
        afterTokens:
          type: integer
          nullable: true
          description: 压缩后上下文占用
          example: 6120
        summaryMessageId:
          type: integer
          format: int64
          nullable: true
          description: 压缩生成的摘要消息 ID（未来策略产出）
        message:
          type: string
          description: 面向用户的提示信息
          example: 上下文压缩功能即将上线，敬请期待

    R_ContextWindowLookupVO:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
        data:
          $ref: '#/components/schemas/ContextWindowLookupVO'

    R_CompressResultVO:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
        data:
          $ref: '#/components/schemas/CompressResultVO'
