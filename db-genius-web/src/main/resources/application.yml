server:
  port: 8109
  servlet:
    context-path: /api

spring:
  application:
    name: db-genius
  ai:
    model:
      # 模型由 ChatModelFactory 运行时动态创建，禁用 Spring AI 默认激活的
      # OpenAI 自动配置（matchIfMissing=true），否则启动时缺 api-key 报错
      chat: ""
      embedding: ""
      image: ""
      audio:
        speech: ""
        transcription: ""
      moderation: ""
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_genius?currentSchema=app}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2

mybatis-plus:
  type-enums-package: com.dbgenius.model.enums
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: 3600
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-header: true

db-genius:
  encrypt-key: ${DB_GENIUS_ENCRYPT_KEY:default-encrypt-key-change-in-production!!}
  model:
    default:
      api-key: ${DB_GENIUS_DEFAULT_MODEL_API_KEY:}
      base-url: ${DB_GENIUS_DEFAULT_MODEL_BASE_URL:https://api.deepseek.com}
      model: ${DB_GENIUS_DEFAULT_MODEL:deepseek-v4-pro}
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    bucket: ${ALIYUN_OSS_BUCKET:}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    dir-prefix: ${ALIYUN_OSS_DIR_PREFIX:uploads/}
  ocr:
    enabled: ${ALIYUN_OCR_ENABLED:false}
    endpoint: ${ALIYUN_OCR_ENDPOINT:ocr-api.cn-hangzhou.aliyuncs.com}
  trial:
    enabled: ${DB_GENIUS_TRIAL_ENABLED:false}
    builtin-db-name: ${DB_GENIUS_TRIAL_BUILTIN_DB_NAME:db-genius}
    builtin-host: ${DB_GENIUS_TRIAL_BUILTIN_HOST:}
    builtin-port: ${DB_GENIUS_TRIAL_BUILTIN_PORT:3306}
    builtin-username: ${DB_GENIUS_TRIAL_BUILTIN_USERNAME:}
    builtin-password: ${DB_GENIUS_TRIAL_BUILTIN_PASSWORD:}

logging:
  level:
    com.dbgenius: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{taskId:-}] %-5level %logger{36} - %msg%n"
