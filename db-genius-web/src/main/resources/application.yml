server:
  port: 8109
  servlet:
    context-path: /api

spring:
  application:
    name: db-genius
  messages:
    # i18n 资源：messages.properties 为英文基底兜底，fallback-to-system-locale=false
    # 保证缺语言时回落到 en 而不是服务器系统语言
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  ai:
    model:
      # 模型由 ChatModelFactory 运行时动态创建，禁用 Spring AI 默认激活的
      # OpenAI 自动配置（matchIfMissing=true），否则启动时缺 api-key 报错
      chat: ""
      embedding: ""
      image: ""
      audio:
        speech: ""
        transcription: ""
      moderation: ""
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_genius?currentSchema=app}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2

mybatis-plus:
  type-enums-package: com.dbgenius.model.enums
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: 3600
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-header: true

db-genius:
  encrypt-key: ${DB_GENIUS_ENCRYPT_KEY:default-encrypt-key-change-in-production!!}
  model:
    default:
      api-key: ${DB_GENIUS_DEFAULT_MODEL_API_KEY:}
      base-url: ${DB_GENIUS_DEFAULT_MODEL_BASE_URL:https://api.deepseek.com}
      model: ${DB_GENIUS_DEFAULT_MODEL:deepseek-v4-pro}
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    bucket: ${ALIYUN_OSS_BUCKET:}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    dir-prefix: ${ALIYUN_OSS_DIR_PREFIX:uploads/}
  ocr:
    enabled: ${ALIYUN_OCR_ENABLED:false}
    endpoint: ${ALIYUN_OCR_ENDPOINT:ocr-api.cn-hangzhou.aliyuncs.com}
  trial:
    enabled: ${DB_GENIUS_TRIAL_ENABLED:false}
    builtin-db-name: ${DB_GENIUS_TRIAL_BUILTIN_DB_NAME:db-genius}
    builtin-host: ${DB_GENIUS_TRIAL_BUILTIN_HOST:}
    builtin-port: ${DB_GENIUS_TRIAL_BUILTIN_PORT:3306}
    builtin-username: ${DB_GENIUS_TRIAL_BUILTIN_USERNAME:}
    builtin-password: ${DB_GENIUS_TRIAL_BUILTIN_PASSWORD:}
  context:
    # 跨轮上下文压缩：LLM 摘要策略已实现（SummaryContextCompressor），
    # auto-compress.enabled 控制"下一轮开始前自动触发"，默认关闭，灰度打开；
    # 手动触发（POST /chat/conversations/{id}/compress）不受此开关限制，随时可用。
    auto-compress:
      enabled: ${DB_GENIUS_AUTO_COMPRESS_ENABLED:false}
      threshold: ${DB_GENIUS_AUTO_COMPRESS_THRESHOLD:0.8}
      # 压缩策略：summary（LLM 摘要，默认）｜noop（空实现，一键回退）
      strategy: ${DB_GENIUS_AUTO_COMPRESS_STRATEGY:summary}
      # 压缩时始终保留最近 N 条消息原样不动，更早的消息（含此前摘要）被折叠进新摘要
      keep-last-messages: ${DB_GENIUS_AUTO_COMPRESS_KEEP_LAST:6}
    # 单次 Agent 运行内（ToolCallAgent 多步 ReAct 循环）的上下文压缩，默认关闭，灰度打开。
    # 与 auto-compress 相互独立：auto-compress 处理"跨轮历史"，in-run-compress 处理
    # "单轮内部因多步工具调用不断累加导致的 context 膨胀"。
    in-run-compress:
      enabled: ${DB_GENIUS_IN_RUN_COMPRESS_ENABLED:false}
      threshold: ${DB_GENIUS_IN_RUN_COMPRESS_THRESHOLD:0.7}
      keep-last-steps: ${DB_GENIUS_IN_RUN_COMPRESS_KEEP_LAST_STEPS:4}
    # 工具输出超长拦截器：始终生效，不受任何开关限制。防止单条工具结果（如大结果集）撑爆上下文。
    # 截断为结构感知（行集按行裁剪，保证产出仍是合法 JSON），完整原文登记进 per-task 制品仓，
    # 模型可用 readToolOutput(artifactId, offset, limit) 分页取回，避免截断诱发无限重试。
    tool-output:
      max-chars: ${DB_GENIUS_TOOL_OUTPUT_MAX_CHARS:4000}
      # 行集裁剪时最多保留的行数（与 max-chars 共同约束，先到先止）
      max-rows: ${DB_GENIUS_TOOL_OUTPUT_MAX_ROWS:50}
      # 按工具名覆盖上限，形如 compareDatabases=8000,readFile=6000；留空表示全部走 max-chars
      per-tool-max-chars: ${DB_GENIUS_TOOL_OUTPUT_PER_TOOL_MAX_CHARS:}
      # 制品仓兜底 TTL 与单任务容量；正常路径由 Agent cleanup 主动释放
      artifact-ttl-minutes: ${DB_GENIUS_TOOL_ARTIFACT_TTL_MINUTES:30}
      artifact-max-per-task: ${DB_GENIUS_TOOL_ARTIFACT_MAX_PER_TASK:20}
  tool:
    # 单条数据库语句的执行超时（秒）：JDBC 走 setQueryTimeout，MongoDB 走 maxTimeMS
    sql-timeout-seconds: ${DB_GENIUS_SQL_TIMEOUT_SECONDS:30}

logging:
  level:
    com.dbgenius: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{taskId:-}] %-5level %logger{36} - %msg%n"
